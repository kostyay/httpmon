# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: httpmon
    main: ./cmd/httpmon
    binary: httpmon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc

homebrew_casks:
  - repository:
      owner: kostyay
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/kostyay/httpmon"
    description: >-
      Terminal-native HTTP/HTTPS debugging proxy
      with MITM interception and TUI
    license: "MIT"
    binaries:
      - httpmon
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine",
                     "#{staged_path}/httpmon"]
          end

release:
  github:
    owner: kostyay
    name: httpmon
  draft: false
  prerelease: auto
